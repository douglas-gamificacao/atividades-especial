function splitWeekActKey(compositeKey){
  const wk = WEEKS.find(w => compositeKey === w.id || compositeKey.startsWith(w.id + "_"));
  if(!wk) return {wid:compositeKey, act:""};
  return {wid:wk.id, act:compositeKey === wk.id ? "" : compositeKey.slice(wk.id.length+1)};
}
function cfgForComposite(sid, compositeKey, fallbackKey){
  const info = splitWeekActKey(compositeKey);
  return {
    wid: info.wid,
    act: info.act || fallbackKey,
    cfg: ALL_DATA[info.wid]?.[sid]?.[info.act] || ALL_DATA[info.wid]?.[sid]?.[fallbackKey]
  };
}
window.speakSupportText=function(encodedText){
  const text=decodeURIComponent(encodedText||"");
  if(!text.trim())return;
  if(!("speechSynthesis" in window)){
    alert("ESTE NAVEGADOR NÃO TEM LEITURA EM VOZ ALTA.");
    return;
  }
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="pt-BR";
  u.rate=.9;
  u.pitch=1;
  window.speechSynthesis.speak(u);
};
window.stopSupportAudio=function(){
  if("speechSynthesis" in window)window.speechSynthesis.cancel();
};

function rrScoreHTML(id,total,label="ACERTOS"){
  return `<div class="score-bar"><span class="score-badge" id="${id}">${label}: 0/${total}</span></div>`;
}
function rrKeyInfo(key){
  return splitWeekActKey(key);
}
function buildCardChoice(sid,cfg,key,title){
  const {wid,act}=rrKeyInfo(key);
  window["rrc_"+sid+"_"+key]={answers:{},total:cfg.items.length,wid,act,title};
  const lg=cfg.lg?" lg":"";
  const cards=cfg.items.map((it,i)=>`
    <div class="rr-card" id="rrc-card-${sid}-${key}-${i}">
      <div class="rr-prompt${lg}">${it.prompt}</div>
      <div class="rr-options">
        ${it.options.map(opt=>`<button class="rr-option${lg}" onclick="rrChoose('${sid}','${key}',${i},'${String(opt).replace(/'/g,"\\'")}')">${opt}</button>`).join("")}
      </div>
      <div class="rr-feedback" id="rrc-fb-${sid}-${key}-${i}"></div>
    </div>`).join("");
  return `${rrScoreHTML("rrc-score-"+sid+"-"+key,cfg.items.length)}${cards}
  <div id="rrc-submit-${sid}-${key}" style="display:none" class="submit-area">
    <button class="submit-btn" onclick="submitCardChoice('${sid}','${key}')">ENVIAR PARA O PROFESSOR</button>
    <button class="retry-btn" onclick="openAct('${sid}','${act}','${wid}')">TENTAR DE NOVO</button>
  </div>`;
}
window.rrChoose=function(sid,key,idx,opt){
  const st=window["rrc_"+sid+"_"+key], cfg=ALL_DATA[st.wid]?.[sid]?.[st.act], item=cfg.items[idx];
  const ok=opt.toUpperCase()===item.correct.toUpperCase();
  st.answers[idx]={value:opt,ok};
  const card=document.getElementById(`rrc-card-${sid}-${key}-${idx}`);
  card.querySelectorAll(".rr-option").forEach(b=>{
    b.disabled=true;
    if(b.textContent.toUpperCase()===item.correct.toUpperCase())b.classList.add("correct");
    else if(b.textContent.toUpperCase()===opt.toUpperCase())b.classList.add("wrong");
  });
  const fb=document.getElementById(`rrc-fb-${sid}-${key}-${idx}`);
  fb.className="rr-feedback "+(ok?"ok":"err");
  fb.textContent=ok ? "CORRETO!" : "QUASE! RESPOSTA: "+item.correct;
  const done=Object.keys(st.answers).length, hits=Object.values(st.answers).filter(a=>a.ok).length;
  document.getElementById(`rrc-score-${sid}-${key}`).textContent=`ACERTOS: ${hits}/${st.total}`;
  if(done===st.total)document.getElementById(`rrc-submit-${sid}-${key}`).style.display="block";
};
window.submitCardChoice=function(sid,key){
  const st=window["rrc_"+sid+"_"+key], cfg=ALL_DATA[st.wid]?.[sid]?.[st.act];
  const hits=Object.values(st.answers).filter(a=>a.ok).length;
  const res=cfg.items.map((it,i)=>`${it.prompt} — MARCOU: ${(st.answers[i]||{}).value||"—"} — CORRETO: ${it.correct}`).join("\n");
  onSent(sid,st.wid,st.act,st.title,`ACERTOS: ${hits}/${st.total}\n\n${res}`,`${hits}/${st.total}`);
};

function buildSyllables(sid,cfg,key){
  const {wid,act}=rrKeyInfo(key);
  window["rrsy_"+sid+"_"+key]={answers:{},build:{},total:cfg.items.length,wid,act};
  const cards=cfg.items.map((it,i)=>{
    const chips=[...it.parts,...(it.extra||[])].sort(()=>Math.random()-.5);
    return `<div class="rr-card">
      <div class="rr-prompt">DICA: ${it.hint}</div>
      <div class="rr-build" id="rrsy-build-${sid}-${key}-${i}"></div>
      <div class="rr-chip-row">
        ${chips.map((c,j)=>`<button class="rr-chip" id="rrsy-chip-${sid}-${key}-${i}-${j}" onclick="rrSyl('${sid}','${key}',${i},${j},'${c.replace(/'/g,"\\'")}')">${c}</button>`).join("")}
      </div>
      <div class="rr-actions"><button class="retry-btn" onclick="rrSylClear('${sid}','${key}',${i})">LIMPAR</button></div>
      <div class="rr-feedback" id="rrsy-fb-${sid}-${key}-${i}"></div>
    </div>`;
  }).join("");
  return `${rrScoreHTML("rrsy-score-"+sid+"-"+key,cfg.items.length,"PALAVRAS")}${cards}
  <div id="rrsy-submit-${sid}-${key}" style="display:none" class="submit-area">
    <button class="submit-btn" onclick="submitSyllables('${sid}','${key}')">ENVIAR PARA O PROFESSOR</button>
    <button class="retry-btn" onclick="openAct('${sid}','${act}','${wid}')">TENTAR DE NOVO</button>
  </div>`;
}
window.rrSyl=function(sid,key,idx,chipIdx,part){
  const st=window["rrsy_"+sid+"_"+key], cfg=ALL_DATA[st.wid]?.[sid]?.[st.act], item=cfg.items[idx];
  st.build[idx]=(st.build[idx]||"")+part;
  document.getElementById(`rrsy-chip-${sid}-${key}-${idx}-${chipIdx}`).classList.add("used");
  const box=document.getElementById(`rrsy-build-${sid}-${key}-${idx}`);
  box.textContent=st.build[idx];
  if(st.build[idx].length>=item.word.length){
    const ok=st.build[idx].toUpperCase()===item.word.toUpperCase();
    st.answers[idx]={value:st.build[idx],ok};
    box.classList.add("complete");
    const fb=document.getElementById(`rrsy-fb-${sid}-${key}-${idx}`);
    fb.className="rr-feedback "+(ok?"ok":"err");
    fb.textContent=ok?"PALAVRA CORRETA!":"PALAVRA CORRETA: "+item.word;
    const done=Object.keys(st.answers).length, hits=Object.values(st.answers).filter(a=>a.ok).length;
    document.getElementById(`rrsy-score-${sid}-${key}`).textContent=`PALAVRAS: ${hits}/${st.total}`;
    if(done===st.total)document.getElementById(`rrsy-submit-${sid}-${key}`).style.display="block";
  }
};
window.rrSylClear=function(sid,key,idx){
  const st=window["rrsy_"+sid+"_"+key];
  st.build[idx]=""; delete st.answers[idx];
  document.getElementById(`rrsy-build-${sid}-${key}-${idx}`).textContent="";
  document.getElementById(`rrsy-build-${sid}-${key}-${idx}`).classList.remove("complete");
  document.querySelectorAll(`[id^="rrsy-chip-${sid}-${key}-${idx}-"]`).forEach(c=>c.classList.remove("used"));

function buildBuilder(sid,cfg,key,title){
  const {wid,act}=rrKeyInfo(key);
  window["rrb_"+sid+"_"+key]={answers:{},build:{},total:cfg.items.length,wid,act,title};
  const cards=cfg.items.map((it,i)=>{
    const blocks=[...it.blocks].sort(()=>Math.random()-.5);
    return `<div class="rr-card">
      <div class="rr-prompt">${it.prompt}</div>
      <div class="rr-build" id="rrb-build-${sid}-${key}-${i}"></div>
      <div class="rr-chip-row">
        ${blocks.map((b,j)=>`<button class="rr-chip" id="rrb-chip-${sid}-${key}-${i}-${j}" onclick="rrBuild('${sid}','${key}',${i},${j},'${b.replace(/'/g,"\\'")}')">${b}</button>`).join("")}
      </div>
      <div class="rr-actions"><button class="retry-btn" onclick="rrBuildClear('${sid}','${key}',${i})">LIMPAR</button></div>
      <div class="rr-feedback" id="rrb-fb-${sid}-${key}-${i}"></div>
    </div>`;
  }).join("");
  return `${rrScoreHTML("rrb-score-"+sid+"-"+key,cfg.items.length)}${cards}
  <div id="rrb-submit-${sid}-${key}" style="display:none" class="submit-area">
    <button class="submit-btn" onclick="submitBuilder('${sid}','${key}')">ENVIAR PARA O PROFESSOR</button>
    <button class="retry-btn" onclick="openAct('${sid}','${act}','${wid}')">TENTAR DE NOVO</button>
  </div>`;
}
window.rrBuild=function(sid,key,idx,chipIdx,block){
  const st=window["rrb_"+sid+"_"+key], cfg=ALL_DATA[st.wid]?.[sid]?.[st.act], item=cfg.items[idx];
  st.build[idx]=st.build[idx]||[];
  st.build[idx].push(block);
  document.getElementById(`rrb-chip-${sid}-${key}-${idx}-${chipIdx}`).classList.add("used");
  document.getElementById(`rrb-build-${sid}-${key}-${idx}`).textContent=st.build[idx].join(" ");
  if(st.build[idx].length===item.blocks.length){
    const value=st.build[idx].join(" "), correct=item.blocks.join(" ");
    const ok=value.toUpperCase()===correct.toUpperCase();
    st.answers[idx]={value,ok};
    const fb=document.getElementById(`rrb-fb-${sid}-${key}-${idx}`);
    fb.className="rr-feedback "+(ok?"ok":"err");
    fb.textContent=ok?"NARRATIVA CORRETA!":"ORDEM CORRETA: "+correct;
    const hits=Object.values(st.answers).filter(a=>a.ok).length;
    document.getElementById(`rrb-score-${sid}-${key}`).textContent=`ACERTOS: ${hits}/${st.total}`;
    if(Object.keys(st.answers).length===st.total)document.getElementById(`rrb-submit-${sid}-${key}`).style.display="block";
  }
};
window.rrBuildClear=function(sid,key,idx){

  st.build[idx]=[]; delete st.answers[idx];
  document.getElementById(`rrb-build-${sid}-${key}-${idx}`).textContent="";
  document.querySelectorAll(`[id^="rrb-chip-${sid}-${key}-${idx}-"]`).forEach(c=>c.classList.remove("used"));

};
window.submitBuilder=function(sid,key){
  const st=window["rrb_"+sid+"_"+key], cfg=ALL_DATA[st.wid]?.[sid]?.[st.act];
  const hits=Object.values(st.answers).filter(a=>a.ok).length;
  const res=cfg.items.map((it,i)=>`${it.prompt} — MONTOU: ${(st.answers[i]||{}).value||"—"} — CORRETO: ${it.blocks.join(" ")}`).join("\n");
  onSent(sid,st.wid,st.act,st.title,`ACERTOS: ${hits}/${st.total}\n\n${res}`,`${hits}/${st.total}`);
};

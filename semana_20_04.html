<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividades Adaptadas — Prof. Douglas Sousa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f2f3f7;min-height:100vh;}
.app{max-width:960px;margin:0 auto;padding:1rem;}
.header{text-align:center;padding:1.5rem 0 1rem;}
.header h1{font-size:24px;font-weight:700;color:#1a1a2e;}
.header p{font-size:14px;color:#888;margin-top:4px;}
.week-pill{display:inline-block;font-size:12px;background:#EEEDFE;color:#534AB7;padding:4px 16px;border-radius:20px;margin-top:8px;font-weight:600;border:1px solid #AFA9EC;}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem;}
.tab-btn{padding:8px 16px;border-radius:10px;border:1.5px solid #e0e0e0;background:#fff;color:#666;font-size:13px;cursor:pointer;transition:all .15s;position:relative;font-weight:500;}
.tab-btn:hover{background:#f5f5f5;}
.tab-btn.active{background:#534AB7;color:#fff;border-color:#534AB7;font-weight:600;box-shadow:0 2px 8px rgba(83,74,183,.3);}
.tab-done-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#1D9E75;}
.tab-done-dot.improve{background:#EF9F27;}
.panel{display:none;}.panel.active{display:block;}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.student-name{font-size:21px;font-weight:700;color:#1a1a2e;margin-bottom:2px;}
.student-sub{font-size:13px;color:#666;}
.theme-pill{display:inline-block;font-size:12px;padding:3px 12px;border-radius:20px;margin-top:8px;background:#E1F5EE;color:#085041;font-weight:600;}
.progress-row{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap;}
.prog-dot{width:12px;height:12px;border-radius:50%;background:#e0e0e0;border:1.5px solid #ccc;transition:all .2s;}
.prog-dot.done{background:#1D9E75;border-color:#0F6E56;}
.prog-label{font-size:12px;color:#666;}
/* SEMANA SELETOR */
.week-selector{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center;}
.week-selector-lbl{font-size:13px;font-weight:700;color:#534AB7;display:flex;align-items:center;gap:5px;}
/* base do botão */
.week-sel-btn{padding:6px 14px;border-radius:20px;border:2px solid;font-size:12px;cursor:pointer;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:5px;}
/* status: nenhuma atividade — vermelho */
.week-sel-btn.ws-none{background:#fff5f5;color:#C0392B;border-color:#E74C3C;}
.week-sel-btn.ws-none:hover{background:#FDECEA;}
.week-sel-btn.ws-none.active{background:#E74C3C;color:#fff;border-color:#C0392B;box-shadow:0 2px 8px rgba(231,76,60,.35);}
/* status: iniciou mas não fez tudo — amarelo */
.week-sel-btn.ws-partial{background:#FFFBF0;color:#B7770D;border-color:#F0A500;}
.week-sel-btn.ws-partial:hover{background:#FEF3D0;}
.week-sel-btn.ws-partial.active{background:#F0A500;color:#fff;border-color:#B7770D;box-shadow:0 2px 8px rgba(240,165,0,.35);}
/* status: fez tudo mas nem tudo 100% — verde */
.week-sel-btn.ws-done{background:#F0FBF5;color:#1A7A4A;border-color:#27AE60;}
.week-sel-btn.ws-done:hover{background:#D5F5E3;}
.week-sel-btn.ws-done.active{background:#27AE60;color:#fff;border-color:#1A7A4A;box-shadow:0 2px 8px rgba(39,174,96,.35);}
/* status: fez tudo com 100% em pelo menos uma tentativa — azul */
.week-sel-btn.ws-perfect{background:#EEF4FF;color:#1A4FAF;border-color:#2E86DE;}
.week-sel-btn.ws-perfect:hover{background:#D6E8FF;}
.week-sel-btn.ws-perfect.active{background:#2E86DE;color:#fff;border-color:#1A4FAF;box-shadow:0 2px 8px rgba(46,134,222,.35);}
/* legenda */
.week-legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:.75rem;padding:.5rem .75rem;background:#f8f8ff;border-radius:8px;border:1px solid #e8e8e8;}
.wleg-item{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;}
.wleg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.acts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:1rem;}
.act-btn{background:#fff;border:1.5px solid #e8e8e8;border-radius:14px;padding:1.25rem;cursor:pointer;text-align:left;transition:all .18s;width:100%;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.act-btn:hover{border-color:#534AB7;background:#EEEDFE;transform:translateY(-1px);}
.act-btn.act-success{border-color:#1D9E75;background:#E1F5EE;}
.act-btn.act-improve{border-color:#EF9F27;background:#FAEEDA;}
.act-done-badge{position:absolute;top:10px;right:10px;font-size:11px;padding:2px 8px;border-radius:20px;}
.act-done-badge.success{background:#1D9E75;color:#fff;}
.act-done-badge.improve{background:#EF9F27;color:#fff;}
.act-icon{font-size:28px;margin-bottom:8px;}
.act-title{font-size:14px;font-weight:700;color:#222;text-transform:uppercase;}
.act-desc{font-size:12px;color:#666;margin-top:2px;}
.act-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-top:6px;background:#EEEDFE;color:#3C3489;font-weight:600;}
.act-date{display:block;font-size:11px;color:#1D9E75;margin-top:4px;}
.disc-lbl{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700;margin-bottom:6px;display:block;}
.disc-hist{background:#E1F5EE;color:#085041;}
.disc-filo{background:#EEF0FE;color:#3C3489;}
.disc-socio{background:#FEF3E0;color:#7A4800;}
.game-area{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.game-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap;}
.back-btn{padding:7px 16px;border-radius:8px;border:1.5px solid #ddd;background:#fff;color:#555;font-size:13px;cursor:pointer;font-weight:600;transition:all .15s;text-transform:uppercase;}
.back-btn:hover{background:#f5f5f5;}
.game-title{font-size:17px;font-weight:700;color:#222;text-transform:uppercase;}
.week-tag{font-size:11px;color:#888;background:#f5f5f5;padding:2px 8px;border-radius:20px;border:1px solid #e0e0e0;}
.how-to{background:#EEEDFE;border-radius:10px;padding:.85rem 1rem;font-size:14px;color:#3C3489;margin-bottom:1rem;display:flex;align-items:flex-start;gap:8px;border:1px solid #AFA9EC;font-weight:600;}
/* LEITURA */
.text-box{background:#f8f8ff;border:1.5px solid #AFA9EC;border-radius:12px;padding:1.25rem 1.5rem;margin-bottom:1.25rem;font-size:16px;line-height:1.9;color:#1a1a2e;font-weight:600;text-transform:uppercase;}
.text-box.lg{font-size:20px;line-height:2.2;}
.text-title{font-size:13px;font-weight:700;color:#534AB7;margin-bottom:.6rem;text-transform:uppercase;}
.quiz-q{font-size:16px;font-weight:700;color:#222;margin:.75rem 0 .5rem;text-transform:uppercase;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.quiz-opt{padding:10px 14px;border-radius:8px;border:1.5px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:15px;font-weight:700;color:#222;text-align:left;transition:all .15s;text-transform:uppercase;}
.quiz-opt:hover:not(:disabled){border-color:#534AB7;background:#EEEDFE;}
.quiz-opt.correct{border-color:#1D9E75;background:#E1F5EE;color:#085041;}
.quiz-opt.wrong{border-color:#E24B4A;background:#FCEBEB;color:#A32D2D;}
/* CAÇA-PALAVRAS */
.ws-wrap{overflow-x:auto;margin-bottom:1rem;}
.ws-grid{display:inline-grid;gap:3px;background:#ddd;border-radius:8px;padding:8px;}
.ws-cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#333;background:#fff;border-radius:4px;cursor:pointer;border:1.5px solid #e0e0e0;user-select:none;text-transform:uppercase;transition:all .12s;}
.ws-cell:hover{background:#f0f0ff;border-color:#AFA9EC;}
.ws-cell.selecting{background:#EEEDFE;color:#534AB7;border-color:#534AB7;transform:scale(1.1);}
.ws-cell.found{background:#E1F5EE;color:#085041;border-color:#1D9E75;}
.ws-words{display:flex;flex-wrap:wrap;gap:8px;margin:1rem 0;}
.ws-word{font-size:14px;font-weight:700;padding:5px 14px;border-radius:20px;background:#f5f5f5;border:1.5px solid #ddd;color:#444;text-transform:uppercase;}
.ws-word.found{background:#E1F5EE;border-color:#1D9E75;color:#085041;text-decoration:line-through;}
/* CRUZADINHA */
.cw-wrap{overflow-x:auto;margin-bottom:1rem;}
.cw-grid{display:inline-grid;gap:2px;background:#444;border-radius:6px;padding:2px;}
.cw-cell{width:38px;height:38px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.cw-cell.black{background:#333;pointer-events:none;}
.cw-cell input{width:100%;height:100%;border:none;outline:none;text-align:center;font-size:16px;font-weight:700;background:transparent;text-transform:uppercase;color:#222;padding:0;caret-color:#534AB7;}
.cw-cell input:focus{background:#EEEDFE;}
.cw-cell input.correct{color:#1D9E75;background:#E1F5EE;}
.cw-cell input.wrong{color:#E24B4A;background:#FCEBEB;}
.cw-num{position:absolute;top:1px;left:2px;font-size:8px;color:#534AB7;font-weight:700;line-height:1;pointer-events:none;}
.cw-clues{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem;}
@media(max-width:500px){.cw-clues{grid-template-columns:1fr;}}
.cw-clue-group h4{font-size:13px;font-weight:700;color:#534AB7;margin-bottom:8px;text-transform:uppercase;}
.cw-clue{font-size:13px;color:#333;margin-bottom:6px;line-height:1.5;font-weight:600;text-transform:uppercase;}
.cw-clue span{font-weight:700;color:#534AB7;margin-right:4px;}
/* VERDADEIRO OU FALSO */
.vf-item{background:#f8f8ff;border:1.5px solid #e0e0e0;border-radius:10px;padding:1rem 1.25rem;margin-bottom:.75rem;}
.vf-text{font-size:15px;font-weight:700;color:#222;margin-bottom:.75rem;text-transform:uppercase;line-height:1.5;}
.vf-btns{display:flex;gap:10px;}
.vf-btn{padding:10px 28px;border-radius:8px;border:1.5px solid #ddd;background:#f5f5f5;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.vf-btn.v-btn:hover:not(:disabled){border-color:#1D9E75;background:#E1F5EE;color:#085041;}
.vf-btn.f-btn:hover:not(:disabled){border-color:#E24B4A;background:#FCEBEB;color:#A32D2D;}
.vf-btn.correct{border-color:#1D9E75;background:#E1F5EE;color:#085041;}
.vf-btn.wrong{border-color:#E24B4A;background:#FCEBEB;color:#A32D2D;}
.vf-btn.reveal{border-color:#534AB7;background:#EEEDFE;color:#3C3489;}
/* LIGAR */
.match-area{display:grid;grid-template-columns:1fr 1fr;gap:1rem;max-width:600px;}
.match-col{display:flex;flex-direction:column;gap:8px;}
.match-item{padding:12px 14px;border-radius:8px;border:1.5px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:14px;font-weight:700;color:#222;transition:all .15s;text-align:center;line-height:1.4;text-transform:uppercase;}
.match-item.lg{font-size:17px;padding:14px 16px;}
.match-item.selected{border-color:#534AB7;background:#EEEDFE;color:#3C3489;}
.match-item.matched-ok{border-color:#1D9E75;background:#E1F5EE;color:#085041;cursor:default;animation:pulse-g .4s ease;}
.match-item.matched-err{border-color:#E24B4A;background:#FCEBEB;color:#A32D2D;}
/* FORCA */
.hangman-area{display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-start;margin-bottom:1.25rem;}
.hangman-svg{flex-shrink:0;}
.hangman-right{flex:1;min-width:200px;}
.hangman-word{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;}
.hangman-letter{width:36px;height:44px;border-bottom:3px solid #534AB7;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#222;text-transform:uppercase;}
.hangman-letter.space{border-bottom:none;width:20px;}
.hangman-keys{display:flex;flex-wrap:wrap;gap:6px;max-width:320px;}
.hangman-key{width:36px;height:36px;border-radius:6px;border:1.5px solid #AFA9EC;background:#EEEDFE;color:#3C3489;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;text-transform:uppercase;}
.hangman-key:hover:not(:disabled){background:#534AB7;color:#fff;border-color:#534AB7;}
.hangman-key:disabled{opacity:.35;cursor:default;}
.hangman-key.hit{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.hangman-key.miss{background:#FCEBEB;border-color:#E24B4A;color:#A32D2D;}
.hangman-hint{font-size:13px;color:#666;font-weight:600;margin-bottom:.75rem;text-transform:uppercase;}
.hangman-lives{font-size:13px;font-weight:700;color:#E24B4A;margin-bottom:.5rem;}
/* MISSÃO ESPACIAL */
.space-mission{background:linear-gradient(135deg,#0d0d2b 0%,#1a1a4e 100%);border-radius:16px;padding:1.5rem;color:#fff;position:relative;overflow:hidden;}
.space-stars{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
.space-star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 2s infinite alternate;}
@keyframes twinkle{0%{opacity:.2;}100%{opacity:1;}}
.space-score{font-size:13px;font-weight:700;color:#FFD700;margin-bottom:1rem;display:flex;align-items:center;gap:8px;}
.space-planet{font-size:48px;text-align:center;margin:1rem 0;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.space-q{font-size:16px;font-weight:700;color:#fff;margin-bottom:1rem;text-transform:uppercase;line-height:1.5;text-align:center;}
.space-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.space-opt{padding:12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;transition:all .15s;text-align:center;}
.space-opt:hover:not(:disabled){border-color:#FFD700;background:rgba(255,215,0,.15);color:#FFD700;}
.space-opt.correct{border-color:#39FF14;background:rgba(57,255,20,.15);color:#39FF14;animation:pulse-g .4s ease;}
.space-opt.wrong{border-color:#FF4444;background:rgba(255,68,68,.15);color:#FF4444;}
.space-progress{display:flex;gap:6px;justify-content:center;margin-bottom:1rem;}
.space-prog-dot{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s;}
.space-prog-dot.hit{background:#39FF14;box-shadow:0 0 6px #39FF14;}
.space-prog-dot.miss{background:#FF4444;}
.space-reveal{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:8px;padding:.75rem;text-align:center;color:#FFD700;font-weight:700;font-size:14px;margin-top:.5rem;text-transform:uppercase;}
/* ARRASTAR SEQUÊNCIA */
.seq-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.seq-item{display:flex;align-items:center;gap:12px;background:#f8f8ff;border:1.5px solid #AFA9EC;border-radius:10px;padding:.85rem 1rem;cursor:grab;user-select:none;transition:all .2s;}
.seq-item:active{cursor:grabbing;transform:scale(1.02);box-shadow:0 4px 12px rgba(83,74,183,.2);}
.seq-item.dragging{opacity:.4;border-style:dashed;}
.seq-item.drag-over{border-color:#534AB7;background:#EEEDFE;}
.seq-item.seq-correct{border-color:#1D9E75;background:#E1F5EE;}
.seq-item.seq-wrong{border-color:#E24B4A;background:#FCEBEB;}
.seq-handle{font-size:18px;color:#AFA9EC;flex-shrink:0;}
.seq-num{width:28px;height:28px;border-radius:50%;background:#534AB7;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.seq-num.correct{background:#1D9E75;}
.seq-num.wrong{background:#E24B4A;}
.seq-text{font-size:14px;font-weight:700;color:#222;text-transform:uppercase;flex:1;}
.seq-lg .seq-text{font-size:17px;}
/* DEBUG HISTÓRICO */
.debug-item{background:#f8f8ff;border:1.5px solid #e0e0e0;border-radius:10px;padding:1rem 1.25rem;margin-bottom:.75rem;}
.debug-sentence{font-size:16px;font-weight:700;color:#222;line-height:1.8;text-transform:uppercase;margin-bottom:.75rem;}
.debug-error{color:#E24B4A;border-bottom:2px solid #E24B4A;cursor:pointer;padding:0 2px;transition:all .15s;}
.debug-error:hover{background:#FCEBEB;border-radius:3px;}
.debug-error.fixed{color:#1D9E75;border-bottom-color:#1D9E75;text-decoration:line-through;}
.debug-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:.5rem;}
.debug-opt{padding:8px 16px;border-radius:20px;border:1.5px solid #AFA9EC;background:#EEEDFE;color:#3C3489;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;transition:all .15s;}
.debug-opt:hover{background:#534AB7;color:#fff;border-color:#534AB7;}
.debug-opt.selected-ok{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
.debug-opt.selected-err{background:#FCEBEB;border-color:#E24B4A;color:#A32D2D;}
.debug-feedback{font-size:13px;font-weight:700;margin-top:.5rem;padding:.5rem .75rem;border-radius:6px;text-transform:uppercase;}
.debug-feedback.ok{background:#E1F5EE;color:#085041;}
.debug-feedback.err{background:#FCEBEB;color:#A32D2D;}
/* ARRASTAR E SOLTAR (Andressa) */
.drag-bank{display:flex;flex-wrap:wrap;gap:8px;padding:1rem;background:#f8f8ff;border:1.5px solid #AFA9EC;border-radius:10px;margin-bottom:1rem;min-height:56px;}
.drag-chip{padding:8px 16px;border-radius:20px;background:#EEEDFE;border:1.5px solid #534AB7;color:#3C3489;font-size:15px;font-weight:700;cursor:grab;user-select:none;text-transform:uppercase;transition:all .15s;}
.drag-chip:active{cursor:grabbing;transform:scale(1.05);}
.drag-chip.used{opacity:.3;cursor:default;}
.drag-sentence{font-size:17px;font-weight:700;color:#1a1a2e;line-height:3;text-transform:uppercase;margin-bottom:.25rem;}
.drag-drop{display:inline-block;min-width:140px;height:34px;border-bottom:3px solid #534AB7;vertical-align:middle;margin:0 4px;text-align:center;font-size:15px;font-weight:700;color:#534AB7;padding:0 8px;transition:all .2s;}
.drag-drop.drag-over-slot{border-bottom-color:#FFD700;background:#FFFBF0;}
.drag-drop.filled{color:#1D9E75;border-bottom-color:#1D9E75;}
.drag-drop.wrong-fill{color:#E24B4A;border-bottom-color:#E24B4A;}
/* MAPA INTERATIVO */
.map-area{position:relative;background:#E8F4FD;border:2px solid #AFA9EC;border-radius:12px;overflow:hidden;margin-bottom:1rem;}
.map-svg{width:100%;height:auto;display:block;}
.map-polis{cursor:pointer;transition:all .2s;}
.map-polis:hover circle{r:18;filter:drop-shadow(0 0 8px rgba(83,74,183,.5));}
.map-polis.answered circle{fill:#1D9E75;}
.map-polis.answered text{fill:#fff;}
.map-question-box{background:#fff;border:1.5px solid #AFA9EC;border-radius:10px;padding:1rem;margin-bottom:1rem;}
.map-q-title{font-size:12px;font-weight:700;color:#534AB7;text-transform:uppercase;margin-bottom:.5rem;}
.map-q-text{font-size:15px;font-weight:700;color:#222;text-transform:uppercase;margin-bottom:.75rem;line-height:1.5;}
.map-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.map-opt{padding:10px;border-radius:8px;border:1.5px solid #ddd;background:#f5f5f5;font-size:14px;font-weight:700;cursor:pointer;text-transform:uppercase;transition:all .15s;text-align:center;}
.map-opt:hover:not(:disabled){border-color:#534AB7;background:#EEEDFE;}
.map-opt.correct{border-color:#1D9E75;background:#E1F5EE;color:#085041;}
.map-opt.wrong{border-color:#E24B4A;background:#FCEBEB;color:#A32D2D;}
.map-legend{display:flex;gap:8px;flex-wrap:wrap;padding:.5rem .75rem;background:#f5f5f5;border-top:1px solid #e0e0e0;}
.map-leg-item{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#534AB7;text-transform:uppercase;}
margin-top:1.5rem;padding-top:1rem;border-top:1px solid #eee;}
.submit-btn{padding:12px 32px;border-radius:10px;background:#534AB7;color:#fff;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(83,74,183,.3);text-transform:uppercase;}
.submit-btn:hover{background:#3C3489;transform:translateY(-1px);}
.retry-btn{padding:10px 28px;border-radius:8px;background:transparent;color:#534AB7;border:1px solid #534AB7;font-size:14px;font-weight:700;cursor:pointer;margin-left:10px;text-transform:uppercase;}

/* ════════════════════════════════════════════════════════
   STATUS DA SEMANA — retorna: 'none'|'partial'|'done'|'perfect'
════════════════════════════════════════════════════════ */
function getWeekStatus(sid, wid){
  const d = ALL_DATA[wid]?.[sid];
  if(!d) return 'none';
  const total = d.acts.length;
  const semData = studentProgress[sid]?.semanas?.[wid] || {};
  const feitas = d.acts.filter(a => semData[a.key]?.feito);
  if(feitas.length === 0) return 'none';
  if(feitas.length < total) return 'partial';
  // fez todas — verifica se alguma tem 100% em alguma tentativa
  const todaPerfeita = feitas.every(a => {
    const entry = semData[a.key];
    if(!entry) return false;
    // verifica se em qualquer tentativa acertou tudo
    if(entry.tentativas){
      return entry.tentativas.some(t => {
        if(t.sucesso === true) return true;
        const m = (t.pontuacao||'').match(/^(\d+)\/(\d+)$/);
        return m && parseInt(m[1]) === parseInt(m[2]) && parseInt(m[2]) > 0;
      });
    }
    return inferSuccess(entry);
  });
  return todaPerfeita ? 'perfect' : 'done';
}

function weekStatusClass(status){ return 'ws-'+status; }
function weekStatusIcon(status){
  if(status==='perfect') return '🔵';
  if(status==='done')    return '🟢';
  if(status==='partial') return '🟡';
  return '🔴';
}
function weekStatusLabel(status){
  if(status==='perfect') return '100% EM TUDO';
  if(status==='done')    return 'FEZ TODAS, SEM 100% EM ALGUMA';
  if(status==='partial') return 'INICIADO';
  return 'NÃO INICIADO';
}
const studentProgress={};
const activeWeek={}; // activeWeek[sid] = weekId

/* ════════════════════════════════════════════════════════
   UTILITÁRIOS
════════════════════════════════════════════════════════ */
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function parseScore(s){if(!s)return{ok:0,total:0,pct:0};const m=s.match(/(\d+)\/(\d+)/);if(!m)return{ok:0,total:0,pct:0};const ok=parseInt(m[1]),t=parseInt(m[2]);return{ok,total:t,pct:t>0?Math.round(ok/t*100):0};}
function inferSuccess(e){if(e.sucesso===true)return true;if(e.sucesso===false)return false;const s=e.pontuacao||'';if(!s)return false;const m=s.match(/^(\d+)\/(\d+)$/);if(m){const ok=parseInt(m[1]),t=parseInt(m[2]);return t>0&&ok===t;}if(e.tentativas)return e.tentativas.some(t=>{if(t.sucesso===true)return true;const tm=t.pontuacao?.match(/^(\d+)\/(\d+)$/);return tm&&parseInt(tm[1])===parseInt(tm[2])&&parseInt(tm[2])>0;});return false;}
function getActStatus(sid,wid,k){const e=studentProgress[sid]?.semanas?.[wid]?.[k];if(!e?.feito)return null;return inferSuccess(e)?'success':'improve';}
function getActDate(sid,wid,k){return studentProgress[sid]?.semanas?.[wid]?.[k]?.data||null;}
function getActAttempts(sid,wid,k){return studentProgress[sid]?.semanas?.[wid]?.[k]?.tentativas?.length||0;}
function getDone(sid,wid){const d=ALL_DATA[wid]?.[sid];if(!d||!studentProgress[sid]?.semanas?.[wid])return[];return d.acts.filter(a=>studentProgress[sid].semanas[wid][a.key]?.feito).map(a=>a.key);}
async function loadProgress(sid){try{const sn=await getDoc(doc(db,"alunos",sid));studentProgress[sid]=sn.exists()?sn.data():{semanas:{}};}catch{studentProgress[sid]={semanas:{}};}}
async function saveActivity(sid,wid,k,result,score,isSuccess){
  const now=new Date().toLocaleString("pt-BR");
  if(!studentProgress[sid])studentProgress[sid]={semanas:{}};
  if(!studentProgress[sid].semanas)studentProgress[sid].semanas={};
  if(!studentProgress[sid].semanas[wid])studentProgress[sid].semanas[wid]={};
  const ex=studentProgress[sid].semanas[wid][k]||{};
  const attempts=[...(ex.tentativas||[]),{data:now,resultado:result,pontuacao:score||"",sucesso:isSuccess}];
  studentProgress[sid].semanas[wid][k]={feito:true,data:attempts[0].data,dataUltima:now,resultado:result,pontuacao:score||"",sucesso:isSuccess||inferSuccess(ex)||false,tentativas:attempts};
  try{await setDoc(doc(db,"alunos",sid),studentProgress[sid]);}catch(e){console.error(e);}
}

  }).join('')}</div>`;

  if(allDone && wid===CURRENT_WEEK.id){
    const sc=d.acts.filter(a=>getActStatus(s.id,wid,a.key)==='success').length;
    return`${weekSel}<div class="card completion-screen">
      <div class="completion-icon">🎉</div><div class="completion-title">SEMANA CONCLUÍDA!</div>
      <div class="completion-sub">${d.congrats}</div>
      <div class="completion-week">SEMANA DE ${wInfo?.label||wid}</div>
      <div style="font-size:13px;color:#555;margin-top:.5rem;">${sc} DE ${total} COM SUCESSO ⭐</div>
    </div><div style="margin-top:1rem;"><p style="font-size:13px;color:#666;text-align:center;margin-bottom:.75rem;">VOCÊ PODE REFAZER QUALQUER ATIVIDADE 👇</p>${actsGrid}</div>`;
  }

  return`${weekSel}<div class="card">
    <div class="student-name">OLÁ, ${s.name.toUpperCase()}! 👋</div>
    <div class="student-sub">${s.year} — ${wInfo?.current?'ATIVIDADES DESTA SEMANA':'ATIVIDADES DA SEMANA: '+wInfo?.label}</div>
    <span class="theme-pill">TEMA: ${d.theme}</span>
    <div class="progress-row">
      ${d.acts.map(a=>{const st=getActStatus(s.id,wid,a.key);return`<div class="prog-dot${st?' done':''}"${st==='improve'?' style="background:#EF9F27"':''} title="${a.title}"></div>`;}).join('')}
      <span class="prog-label">${done.length} DE ${total} FEITAS</span>
    </div>
  </div>${actsGrid}`;
}

window.setWeek=function(sid,wid){
  activeWeek[sid]=wid;
  document.getElementById("panel-"+sid).innerHTML=homeHTML(STUDENTS.find(x=>x.id===sid));
};

/* ════════════════════════════════════════════════════════
   TABS
════════════════════════════════════════════════════════ */
async function buildTabs(){
  await Promise.all(STUDENTS.map(s=>loadProgress(s.id)));
  // inicializa semana ativa = atual para todos
  STUDENTS.forEach(s=>{ activeWeek[s.id]=CURRENT_WEEK.id; });
  document.getElementById("loading-overlay").style.display="none";
  const te=document.getElementById("tabs"),pe=document.getElementById("panels");
  STUDENTS.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="tab-btn"+(i===0?" active":"");b.textContent=s.name;b.id="tab-"+s.id;b.onclick=()=>switchTab(s.id);te.appendChild(b);
    const p=document.createElement("div");p.className="panel"+(i===0?" active":"");p.id="panel-"+s.id;p.innerHTML=homeHTML(s);pe.appendChild(p);
    updateTabDot(s.id);
  });
}
function updateTabDot(sid){
  const wid=CURRENT_WEEK.id,d=ALL_DATA[wid]?.[sid];
  if(!d)return;
  const done=getDone(sid,wid),total=d.acts.length,tab=document.getElementById("tab-"+sid);
  if(!tab)return;
  const ex=tab.querySelector(".tab-done-dot");if(ex)ex.remove();
  if(done.length>0){const allOk=done.every(k=>getActStatus(sid,wid,k)==='success');const dot=document.createElement("span");dot.className="tab-done-dot"+(allOk?"":" improve");tab.appendChild(dot);}
}
function switchTab(id){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("tab-"+id).classList.add("active");
  document.getElementById("panel-"+id).classList.add("active");
  document.getElementById("panel-"+id).innerHTML=homeHTML(STUDENTS.find(x=>x.id===id));
}

/* ════════════════════════════════════════════════════════
   ENVIO
════════════════════════════════════════════════════════ */
async function onSent(sid,wid,key,actName,result,score){
  const s=STUDENTS.find(x=>x.id===sid),{ok,total,pct}=parseScore(score),isSuccess=total===0||pct===100;
  await saveActivity(sid,wid,key,result,score,isSuccess);
  updateTabDot(sid);
  const att=getActAttempts(sid,wid,key),attL=att>1?` (${att}ª TENTATIVA)`:"";
  const wInfo=WEEKS.find(w=>w.id===wid);
  const subject=`[Gamificação Total] ${s.full} — ${actName}${attL} — ${isSuccess?"✓ Sucesso":"🔄 Pode melhorar"} — ${pct>0?pct+"%":"OK"}`;
  const body=`Aluno: ${s.full}\nTurma: ${s.year}\nSemana: ${wInfo?.label||wid}\nAtividade: ${actName}${attL}\nPontuação: ${score||"—"}\nAcertos: ${total>0?ok+"/"+total+" ("+pct+"%)":"Concluído"}\nResultado: ${isSuccess?"✓ Sucesso":"🔄 Pode melhorar"}\n\n${result}\n\nData: ${new Date().toLocaleString("pt-BR")}`;
  const ov=document.createElement("div");ov.style.cssText="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:999;font-size:16px;color:#534AB7;font-weight:700;";ov.textContent="ENVIANDO PARA O PROFESSOR... ✉️";document.body.appendChild(ov);
  try{const fd=new FormData();fd.append("payload",JSON.stringify({to:EMAIL,subject,body,studentName:s.full,activity:actName,week:wInfo?.label||wid,score:score||"",isSuccess}));await fetch(SCRIPT_URL,{method:"POST",body:fd});}catch{}
  document.body.removeChild(ov);
  if(isSuccess)alert(`INCRÍVEL, ${s.name.toUpperCase()}! 🏆 VOCÊ ACERTOU TUDO!\nO PROFESSOR DOUGLAS JÁ RECEBEU SEU RESULTADO!`);
  else{const msg=pct>=70?`MUITO BEM, ${s.name.toUpperCase()}! ⭐ VOCÊ ACERTOU ${ok} DE ${total}!`:pct>=40?`PARABÉNS, ${s.name.toUpperCase()}! 🌟 VOCÊ ACERTOU ${ok} DE ${total}!`:`MUITO BEM, ${s.name.toUpperCase()}! 🎉 VOCÊ FEZ A ATIVIDADE! ACERTOU ${ok} DE ${total}.`;alert(`${msg}\n\n📬 ENVIADO PARA O PROFESSOR DOUGLAS!`);}
  switchTab(sid);
}

/* ════════════════════════════════════════════════════════
   ABRIR ATIVIDADE — recebe wid explícito
════════════════════════════════════════════════════════ */
function openAct(sid,key,wid){
  wid=wid||activeWeek[sid]||CURRENT_WEEK.id;
  const s=STUDENTS.find(x=>x.id===sid),d=ALL_DATA[wid]?.[sid];
  if(!d)return;
  const act=d.acts.find(a=>a.key===key);
  if(!act)return;
  let html="";
  // roteamento por tipo de atividade
  const type=act.how;
  if(type==="reading")        html=buildReading(sid,wid,d.reading);
  else if(type==="crossword"){const cfg=d[key]||d.crossword;html=buildCrossword(sid,cfg,wid+"_"+key);}
  else if(type==="wordsearch"){const cfg=d[key]||d.wordsearch;html=buildWordSearch(sid,cfg,wid+"_"+key);}
  else if(type==="truefalse") html=buildTrueFalse(sid,d[key],wid+"_"+key);
  else if(type==="match")     html=buildMatch(sid,d[key],d[key]?.lg,wid+"_"+key);
  else if(type==="hangman")   html=buildHangman(sid,d[key],wid+"_"+key);
  else if(type==="memory")    html=buildMemory(sid,d[key]||d.memory,wid+"_"+key);
  else if(type==="fill")      html=buildFill(sid,d[key]||d.fillblank,wid+"_"+key);
  else if(type==="goal")      html=buildGoal(sid,d.goal,wid);
  else if(type==="spacemission") html=buildSpaceMission(sid,d.spacemission,wid+"_"+key);
  else if(type==="sequence")     html=buildSequence(sid,d.sequence,wid+"_"+key);
  else if(type==="debug")        html=buildDebug(sid,d.debug,wid+"_"+key);
  else if(type==="penalti")      html=buildPenalti(sid,d.penalti,wid+"_"+key);
  else if(type==="mapgame")      html=buildMapGame(sid,d.mapgame,wid+"_"+key);
  else if(type==="dragdrop")     html=buildDragDrop(sid,d[key]||d.dragdrop,wid+"_"+key);
  const wInfo=WEEKS.find(w=>w.id===wid);
  const wt=`<span class="week-tag">SEMANA ${wInfo?.label||wid}</span>`;
  document.getElementById("panel-"+sid).innerHTML=`<div class="game-area">
    <div class="game-header">
      <button class="back-btn" onclick="switchTab('${sid}')">← VOLTAR</button>
      <span class="game-title">${act.icon} ${act.title}</span>${wt}
    </div>
    <div class="how-to"><span>ℹ️</span><span>${HOWTO[type]||''}</span></div>
    ${html}</div>`;
  setTimeout(()=>{
    if(type==="match")initMatch(sid,wid+"_"+key,d[key]);
    if(type==="wordsearch")initWS(sid,wid+"_"+key,d[key]||d.wordsearch);
  },50);
}

function buildReading(sid,wid,cfg){
  const lg=cfg.lg?"lg":"",qkey=wid+"_reading";
  window["quiz_"+sid+"_"+qkey]={answers:[],total:cfg.questions.length,done:0,wid};
  const qs=cfg.questions.map((q,i)=>`
    <div class="quiz-q">PERGUNTA ${i+1}: ${q.q}</div>
    <div class="quiz-opts">${shuffle(q.options).map(o=>`<button class="quiz-opt" onclick="answerQuiz('${sid}','${qkey}',${i},'${o.replace(/'/g,"\\'")}','${q.correct.replace(/'/g,"\\'")}')"> ${o}</button>`).join("")}</div>
  `).join("");
  return`<div class="text-box ${lg}"><div class="text-title">📄 LEIA COM ATENÇÃO:</div>${cfg.text}</div>
  <div id="qarea-${sid}-${qkey}">${qs}</div>
  <div id="qsub-${sid}-${qkey}" style="display:none;" class="submit-area">
    <div class="success-msg" id="qmsg-${sid}-${qkey}"></div>
    <button class="submit-btn" onclick="submitReading('${sid}','${qkey}')">ENVIAR PARA O PROFESSOR</button>
    <button class="retry-btn" onclick="openAct('${sid}','reading','${wid}')">TENTAR DE NOVO</button>
  </div>`;
}
window.answerQuiz=function(sid,qkey,qi,chosen,correct){
  const st=window["quiz_"+sid+"_"+qkey];if(!st||st.answers[qi]!==undefined)return;
  st.answers[qi]={chosen,correct,ok:chosen.trim()===correct.trim()};st.done++;
  const btns=document.querySelectorAll(`#qarea-${sid}-${qkey} .quiz-opts`)[qi].querySelectorAll(".quiz-opt");
  btns.forEach(b=>{b.disabled=true;if(b.textContent.trim()===correct)b.classList.add("correct");else if(b.textContent.trim()===chosen)b.classList.add("wrong");});
  if(st.done===st.total){
    const ok=st.answers.filter(a=>a.ok).length;
    document.getElementById("qmsg-"+sid+"-"+qkey).textContent=`VOCÊ ACERTOU ${ok} DE ${st.total} PERGUNTAS!`;
    document.getElementById("qsub-"+sid+"-"+qkey).style.display="block";
  }
};
window.submitReading=function(sid,qkey){
  const st=window["quiz_"+sid+"_"+qkey],ok=st.answers.filter(a=>a.ok).length;
  const res=st.answers.map((a,i)=>`P${i+1}: ${a.chosen} — ${a.ok?"CORRETO":"ERRADO (CORRETO: "+a.correct+")"}`).join("\n");
  onSent(sid,st.wid,"reading","LEITURA E INTERPRETAÇÃO",`ACERTOS: ${ok}/${st.total}\n\n${res}`,`${ok}/${st.total}`);
};

function buildTrueFalse(sid,cfg,key){
  const[wid,actKey]=key.split(/_(.+)/);
  window["vf_"+sid+"_"+key]={answers:{},total:cfg.items.length,wid,actKey};
  const items=cfg.items.map((item,i)=>`
    <div class="vf-item" id="vfi-${sid}-${key}-${i}">
      <div class="vf-text">${i+1}. ${item.text}</div>
      <div class="vf-btns">
        <button class="vf-btn v-btn" onclick="answerVF('${sid}','${key}',${i},true,${item.correct})">✅ VERDADEIRO</button>
        <button class="vf-btn f-btn" onclick="answerVF('${sid}','${key}',${i},false,${item.correct})">❌ FALSO</button>
      </div>
    </div>`).join("");
  return`<div class="score-bar"><span class="score-badge" id="vfscore-${sid}-${key}">RESPONDIDAS: 0/${cfg.items.length}</span></div>
  ${items}
  <div id="vfsub-${sid}-${key}" style="display:none;" class="submit-area">

}
window.answerVF=function(sid,key,idx,chosen,correct){
  const st=window["vf_"+sid+"_"+key];if(!st||st.answers[idx]!==undefined)return;
  const ok=chosen===correct;st.answers[idx]={chosen,correct,ok};
  const btns=document.querySelectorAll(`#vfi-${sid}-${key}-${idx} .vf-btn`);
  btns.forEach(b=>b.disabled=true);
  const clicked=chosen?btns[0]:btns[1];clicked.classList.add(ok?"correct":"wrong");
  if(!ok){const reveal=correct?btns[0]:btns[1];reveal.classList.add("reveal");}
  const done=Object.keys(st.answers).length;
  document.getElementById(`vfscore-${sid}-${key}`).textContent=`RESPONDIDAS: ${done}/${st.total}`;
  if(done===st.total){
    const okCount=Object.values(st.answers).filter(a=>a.ok).length;
    document.getElementById(`vfmsg-${sid}-${key}`).textContent=`VOCÊ ACERTOU ${okCount} DE ${st.total}!`;
    document.getElementById(`vfsub-${sid}-${key}`).style.display="block";
  }
};
window.submitVF=function(sid,key){
  const st=window["vf_"+sid+"_"+key];
  const cfgData=ALL_DATA[st.wid]?.[sid]?.[st.actKey];
  if(!cfgData)return;
  const ok=Object.values(st.answers).filter(a=>a.ok).length;
  const res=cfgData.items.map((item,i)=>{const a=st.answers[i]||{};return`"${item.text}" — ${a.chosen?"VERDADEIRO":"FALSO"} — ${a.ok?"CORRETO":"ERRADO (CORRETO: "+(item.correct?"VERDADEIRO":"FALSO")+")"}`}).join("\n");
  const names={filo_truefalse:"FILOSOFIA — VERDADEIRO OU FALSO",socio_truefalse:"SOCIOLOGIA — VERDADEIRO OU FALSO"};
  onSent(sid,st.wid,st.actKey,names[st.actKey]||"VERDADEIRO OU FALSO",`ACERTOS: ${ok}/${st.total}\n\n${res}`,`${ok}/${st.total}`);
};

/* ════════════════════════════════════════════════════════
   LIGAR COLUNAS
════════════════════════════════════════════════════════ */
function buildMatch(sid,cfg,lg,key){
  const lc=lg?"lg":"";
  // extrair actKey da chave composta (ex: semana_27_04_2026_filo_matching -> filo_matching)
  const actKey=key.replace(/^semana_\d+_\d+_\d+_/,'');
  return`<div class="match-area">
    <div class="match-col" id="ml-${sid}-${key}">${cfg.pairs.map((p,i)=>`<div class="match-item ${lc}" id="mli-${sid}-${key}-${i}" onclick="selMatch('${sid}','l',${i},'${key}')">${p.left}</div>`).join("")}</div>
    <div class="match-col" id="mr-${sid}-${key}"></div>
  </div>
  <div id="mres-${sid}-${key}"></div>
  <div id="msub-${sid}-${key}" style="display:none;" class="submit-area">
    <button class="submit-btn" onclick="submitMatch('${sid}','${key}')">ENVIAR PARA O PROFESSOR</button>
    <button class="retry-btn" onclick="openAct('${sid}','${actKey}')">TENTAR DE NOVO</button>
  </div>`;
}
function initMatch(sid,key,cfg){
  window["mat_"+sid+"_"+key]={lsel:null,rsel:null,pairs:[],done:0,cfg,key};
  const order=shuffle(cfg.pairs.map((_,i)=>i));
  const lg=cfg.lg?"lg":"";
  document.getElementById("mr-"+sid+"-"+key).innerHTML=order.map(i=>`<div class="match-item ${lg}" id="mri-${sid}-${key}-${i}" onclick="selMatch('${sid}','r',${i},'${key}')">${cfg.pairs[i].right}</div>`).join("");
}
window.selMatch=function(sid,side,idx,key){
  const st=window["mat_"+sid+"_"+key];if(!st)return;
  const cfg=st.cfg,el=document.getElementById((side==="l"?"mli-":"mri-")+sid+"-"+key+"-"+idx);
  if(el.classList.contains("matched-ok"))return;
  if(side==="l"){if(st.lsel!==null){const p=document.getElementById("mli-"+sid+"-"+key+"-"+st.lsel);if(p)p.classList.remove("selected");}st.lsel=idx;el.classList.add("selected");}
  else{if(st.rsel!==null){const p=document.getElementById("mri-"+sid+"-"+key+"-"+st.rsel);if(p)p.classList.remove("selected");}st.rsel=idx;el.classList.add("selected");}
  if(st.lsel!==null&&st.rsel!==null){
    const le=document.getElementById("mli-"+sid+"-"+key+"-"+st.lsel),re=document.getElementById("mri-"+sid+"-"+key+"-"+st.rsel);
    const ok=cfg.pairs[st.lsel].right===cfg.pairs[st.rsel].right;
    le.classList.remove("selected");re.classList.remove("selected");
    if(ok){le.classList.add("matched-ok");re.classList.add("matched-ok");st.done++;st.pairs.push({l:cfg.pairs[st.lsel].left,r:cfg.pairs[st.rsel].right,ok:true});}
    else{le.classList.add("matched-err");re.classList.add("matched-err");st.pairs.push({l:cfg.pairs[st.lsel].left,r:cfg.pairs[st.rsel].right,ok:false});setTimeout(()=>{le.classList.remove("matched-err");re.classList.remove("matched-err");},900);}
    st.lsel=null;st.rsel=null;
    if(st.done===cfg.pairs.length){document.getElementById("mres-"+sid+"-"+key).innerHTML='<div class="success-msg" style="margin-top:1rem;">TODOS OS PARES LIGADOS! 🎉</div>';document.getElementById("msub-"+sid+"-"+key).style.display="block";}
  }
};
window.submitMatch=function(sid,key){
  const st=window["mat_"+sid+"_"+key],cfg=st.cfg,ok=st.pairs.filter(p=>p.ok).length;
  // extrair wid e actKey da chave composta
  const parts=key.match(/^(semana_\d+_\d+_\d+)_(.+)$/);
  const wid=parts?parts[1]:CURRENT_WEEK.id, actKey=parts?parts[2]:key;
  const names={matching:"LIGAR PALAVRAS",mj_match:"LIGAR AS IDEIAS",filo_matching:"FILOSOFIA — LIGAR CONCEITOS",socio_matching:"SOCIOLOGIA — LIGAR CONCEITOS"};
  onSent(sid,wid,actKey,names[actKey]||"LIGAR CONCEITOS",`ACERTOS: ${ok}/${cfg.pairs.length}\n\n${st.pairs.map(p=>`${p.l} → ${p.r}: ${p.ok?"CORRETO":"ERRADO"}`).join("\n")}`,`${ok}/${cfg.pairs.length}`);
};

/* ════════════════════════════════════════════════════════
   JOGO DA FORCA
════════════════════════════════════════════════════════ */
function buildHangman(sid,cfg,key){
  const words=shuffle([...cfg.words]);
  const actKey=key.replace(/^semana_\d+_\d+_\d+_/,'');
  const wid=key.replace(/_[^_]+$/,'').replace(/^(semana_\d+_\d+_\d+).*/,'$1');
  window["hm_"+sid+"_"+key]={words,idx:0,guessed:[],wrong:[],maxWrong:6,wid,actKey};
  return`<div id="hmarea-${sid}-${key}">${renderHangman(sid,key)}</div>`;
}
function renderHangman(sid,key){
  const st=window["hm_"+sid+"_"+key];if(!st||st.idx>=st.words.length)return hangmanComplete(sid,key);
  const{word,hint}=st.words[st.idx],wrong=st.wrong,guessed=st.guessed,lives=6-wrong.length,won=word.split("").every(l=>guessed.includes(l)||l===" ");
  const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const wordHTML=word.split("").map(l=>l===" "?`<div class="hangman-letter space"></div>`:`<div class="hangman-letter">${guessed.includes(l)?l:""}</div>`).join("");
  const svgParts=[
    `<line x1="20" y1="130" x2="100" y2="130" stroke="#534AB7" stroke-width="4"/>`,
    `<line x1="60" y1="130" x2="60" y2="20" stroke="#534AB7" stroke-width="4"/>`,
    `<line x1="60" y1="20" x2="100" y2="20" stroke="#534AB7" stroke-width="4"/>`,
    `<line x1="100" y1="20" x2="100" y2="35" stroke="#534AB7" stroke-width="4"/>`,
    `<circle cx="100" cy="45" r="10" stroke="#E24B4A" stroke-width="3" fill="none"/>`,
    `<line x1="100" y1="55" x2="100" y2="90" stroke="#E24B4A" stroke-width="3"/>`,
    `<line x1="100" y1="65" x2="82" y2="78" stroke="#E24B4A" stroke-width="3"/>`,
    `<line x1="100" y1="65" x2="118" y2="78" stroke="#E24B4A" stroke-width="3"/>`,
    `<line x1="100" y1="90" x2="82" y2="115" stroke="#E24B4A" stroke-width="3"/>`,
    `<line x1="100" y1="90" x2="118" y2="115" stroke="#E24B4A" stroke-width="3"/>`,
  ];
  const drawn=svgParts.slice(0,4+wrong.length).join("");
  if(won){
    const msg=st.idx+1<st.words.length?"PARABÉNS! PRÓXIMA PALAVRA →":"VOCÊ DESCOBRIU TODAS AS PALAVRAS! 🎉";
    return`<div class="hangman-area"><svg class="hangman-svg" width="140" height="140" viewBox="0 0 140 140">${drawn}</svg>
    <div class="hangman-right"><div class="hangman-hint">💡 DICA: ${hint}</div><div class="hangman-word">${wordHTML}</div>
    <div class="success-msg">${msg}</div>
    ${st.idx+1<st.words.length?`<button class="submit-btn" onclick="nextHangman('${sid}','${key}')">PRÓXIMA PALAVRA</button>`:`<div class="submit-area"><button class="submit-btn" onclick="submitHangman('${sid}','${key}')">ENVIAR PARA O PROFESSOR</button></div>`}
    </div></div>`;
  }
  if(lives===0){
    const msg=st.idx+1<st.words.length?`A PALAVRA ERA: ${word}. PRÓXIMA →`:`FIM DE JOGO! A PALAVRA ERA: ${word}`;
    return`<div class="hangman-area"><svg class="hangman-svg" width="140" height="140" viewBox="0 0 140 140">${drawn}</svg>
    <div class="hangman-right"><div class="hangman-hint">💡 DICA: ${hint}</div>
    <div class="hangman-word">${word.split("").map(l=>`<div class="hangman-letter" style="color:#E24B4A">${l}</div>`).join("")}</div>
    <div style="color:#E24B4A;font-weight:700;margin-bottom:.75rem;">${msg}</div>
    ${st.idx+1<st.words.length?`<button class="submit-btn" onclick="nextHangman('${sid}','${key}')">PRÓXIMA PALAVRA</button>`:`<div class="submit-area"><button class="submit-btn" onclick="submitHangman('${sid}','${key}')">ENVIAR PARA O PROFESSOR</button></div>`}
    </div></div>`;
  }
  const keysHTML=letters.map(l=>{const isG=guessed.includes(l)||wrong.includes(l);const cls=guessed.includes(l)?"hit":wrong.includes(l)?"miss":"";return`<button class="hangman-key ${cls}" ${isG?"disabled":""} onclick="guessLetter('${sid}','${key}','${l}')">${l}</button>`;}).join("");
  return`<div class="hangman-area"><svg class="hangman-svg" width="140" height="140" viewBox="0 0 140 140">${drawn}</svg>
    <div class="hangman-right"><div class="hangman-lives">❤️ VIDAS: ${lives}/6</div><div class="hangman-hint">💡 DICA: ${hint}</div><div class="hangman-word">${wordHTML}</div></div>
  </div><div class="hangman-keys">${keysHTML}</div>`;
}

function initWS(sid,key,cfg){window["ws_"+sid+"_"+key]={first:null,found:[],total:cfg.words.length,cfg,key};}
window.wsClick=function(sid,key,r,c){
  const st=window["ws_"+sid+"_"+key];if(!st)return;const cfg=st.cfg;
  if(!st.first){st.first={r,c};document.getElementById(`wsc-${sid}-${key}-${r}-${c}`).classList.add("selecting");document.getElementById(`wsstat-${sid}-${key}`).textContent="AGORA CLIQUE NA ÚLTIMA LETRA!";return;}

  const dr=r===r1?0:(r>r1?1:-1),dc=c===c1?0:(c>c1?1:-1);

function buildCrossword(sid,cfg,key){
  const R=cfg.rows,C=cfg.cols;
  const grid=Array.from({length:R},()=>Array(C).fill(null));
  cfg.words.forEach(w=>{for(let i=0;i<w.word.length;i++){const r=w.dir==="H"?w.row:w.row+i,c=w.dir==="H"?w.col+i:w.col;if(r<0||r>=R||c<0||c>=C)return;if(!grid[r][c])grid[r][c]={num:null};if(i===0)grid[r][c].num=w.num;}});
  let cells='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(!grid[r][c]){cells+=`<div class="cw-cell black"></div>`;continue;}cells+=`<div class="cw-cell">${grid[r][c].num?`<span class="cw-num">${grid[r][c].num}</span>`:''}<input maxlength="1" id="cwi-${sid}-${key}-${r}-${c}" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div>`;}
  const hC=cfg.words.filter(w=>w.dir==="H").map(w=>`<div class="cw-clue"><span>${w.num}.</span>${w.clue}</div>`).join('');
  const vC=cfg.words.filter(w=>w.dir==="V").map(w=>`<div class="cw-clue"><span>${w.num}.</span>${w.clue}</div>`).join('');
  const actKey=key.replace(/^semana_\d+_\d+_\d+_/,'');
  return`<div class="cw-wrap"><div class="cw-grid" style="grid-template-columns:repeat(${C},38px);grid-template-rows:repeat(${R},38px);">${cells}</div></div>
  <div class="cw-clues"><div class="cw-clue-group"><h4>➡️ HORIZONTAL</h4>${hC}</div><div class="cw-clue-group"><h4>⬇️ VERTICAL</h4>${vC}</div></div>
  <div class="submit-area"><button class="submit-btn" onclick="checkCW('${sid}','${key}')">VERIFICAR E ENVIAR</button><button class="retry-btn" onclick="openAct('${sid}','${actKey}')">RECOMEÇAR</button></div>`;
}
window.checkCW=function(sid,key){
  const parts=key.match(/^(semana_\d+_\d+_\d+)_(.+)$/);
  const wid=parts?parts[1]:CURRENT_WEEK.id, actKey=parts?parts[2]:key;
  const d=ALL_DATA[wid]?.[sid];if(!d)return;
  const cfg=d[actKey]||d.crossword;if(!cfg)return;
  let ok=0,total=0,res=[];
  cfg.words.forEach(w=>{let wOk=true;for(let i=0;i<w.word.length;i++){const r=w.dir==="H"?w.row:w.row+i,c=w.dir==="H"?w.col+i:w.col;const inp=document.getElementById(`cwi-${sid}-${key}-${r}-${c}`);if(!inp)continue;total++;const v=inp.value.trim().toUpperCase(),correct=v===w.word[i].toUpperCase();inp.classList.remove("correct","wrong");inp.classList.add(correct?"correct":"wrong");if(!correct)wOk=false;else ok++;}res.push(`${w.dir==="H"?"➡️":"⬇️"} ${w.num}. ${w.word}: ${wOk?"CORRETO ✓":"INCORRETO"}`);});
  const names={filo_crossword:"FILOSOFIA — CRUZADINHA",socio_crossword:"SOCIOLOGIA — CRUZADINHA",crossword:"CRUZADINHA"};
  onSent(sid,wid,actKey,names[actKey]||"CRUZADINHA",`LETRAS CORRETAS: ${ok}/${total}\n\nPALAVRAS:\n${res.join("\n")}`,`${ok}/${total}`);
};

window.flipMem=function(sid,key,idx){
  const st=window["mem_"+sid+"_"+key];if(st.locked)return;
  const el=document.getElementById("mc-"+sid+"-"+key+"-"+idx);
  if(el.dataset.matched||el.dataset.flipped)return;
  el.dataset.flipped="1";el.style.background="#EEEDFE";el.style.borderColor="#534AB7";
  el.querySelector(".bf").style.display="none";el.querySelector(".ff").style.display="flex";
  st.flipped.push(idx);
  if(st.flipped.length===2){
    st.locked=true;const[a,b]=st.flipped;const ca=st.cards[a],cb=st.cards[b];
    setTimeout(()=>{
      if(ca.id===cb.id&&ca.type!==cb.type){
        [a,b].forEach(i=>{const e=document.getElementById("mc-"+sid+"-"+key+"-"+i);e.dataset.matched="1";e.style.background="#E1F5EE";e.style.borderColor="#1D9E75";});
        st.matched++;document.getElementById("ms-"+sid+"-"+key).textContent=`PARES: ${st.matched}/${st.total}`;
        if(st.matched===st.total){document.getElementById("mt-"+sid+"-"+key).textContent="INCRÍVEL!";document.getElementById("msub-"+sid+"-"+key).style.display="block";}
      }else{
        [a,b].forEach(i=>{const e=document.getElementById("mc-"+sid+"-"+key+"-"+i);delete e.dataset.flipped;e.style.background="#f5f5f5";e.style.borderColor="#ddd";e.querySelector(".bf").style.display="";e.querySelector(".ff").style.display="none";});
      }
      st.flipped=[];st.locked=false;
    },900);
  }
};

window.answerSpace=function(sid,key,qi,chosen,correct,btn){
  const st=window["sm_"+sid+"_"+key];if(st.answers[qi])return;

   📋 ARRASTAR SEQUÊNCIA

function buildSequence(sid,cfg,key){
  const wid=key.replace(/_sequence$/,'');
  const shuffled=shuffle([...cfg.items]);
  window["seq_"+sid+"_"+key]={items:shuffled,correct:cfg.items,wid,checked:false};
  const lgCls=cfg.lg?"seq-lg":"";
  const listHTML=shuffled.map((item,i)=>`
    <div class="seq-item ${lgCls}" id="seqi-${sid}-${key}-${i}" draggable="true"
      ondragstart="seqDragStart(event,'${sid}','${key}',${i})"
      ondragover="seqDragOver(event,'${sid}','${key}',${i})"
      ondrop="seqDrop(event,'${sid}','${key}',${i})"
      ondragleave="seqDragLeave(event,'${sid}','${key}',${i})">
      <span class="seq-handle">☰</span>
      <span class="seq-num" id="seqn-${sid}-${key}-${i}">${i+1}</span>
      <span class="seq-text">${item.text}</span>
    </div>`).join('');
  return`<p style="font-size:14px;font-weight:700;color:#534AB7;margin-bottom:1rem;text-transform:uppercase;">📋 ${cfg.instruction}</p>
  <div class="seq-list" id="seqlist-${sid}-${key}">${listHTML}</div>
  <div id="seqres-${sid}-${key}"></div>
  <div class="submit-area">
    <button class="submit-btn" onclick="checkSequence('${sid}','${key}')">VERIFICAR E ENVIAR</button>
    <button class="retry-btn" onclick="openAct('${sid}','sequence','${wid}')">RECOMEÇAR</button>
  </div>`;
}
window._seqDrag={};
window.seqDragStart=function(e,sid,key,idx){window._seqDrag={sid,key,idx};e.currentTarget.classList.add("dragging");};
window.seqDragOver=function(e,sid,key,idx){e.preventDefault();document.getElementById("seqi-"+sid+"-"+key+"-"+idx).classList.add("drag-over");};
window.seqDragLeave=function(e,sid,key,idx){document.getElementById("seqi-"+sid+"-"+key+"-"+idx).classList.remove("drag-over");};
window.seqDrop=function(e,sid,key,toIdx){
  e.preventDefault();
  const{idx:fromIdx}=window._seqDrag;if(fromIdx===toIdx)return;
  const st=window["seq_"+sid+"_"+key];
  [st.items[fromIdx],st.items[toIdx]]=[st.items[toIdx],st.items[fromIdx]];
  const list=document.getElementById("seqlist-"+sid+"-"+key);
  const fromEl=document.getElementById("seqi-"+sid+"-"+key+"-"+fromIdx);
  const toEl=document.getElementById("seqi-"+sid+"-"+key+"-"+toIdx);
  fromEl.classList.remove("dragging");toEl.classList.remove("drag-over");
  // re-render textos sem recriar elementos
  fromEl.querySelector(".seq-text").textContent=st.items[fromIdx].text;
  toEl.querySelector(".seq-text").textContent=st.items[toIdx].text;
};
window.checkSequence=function(sid,key){
  const st=window["seq_"+sid+"_"+key];
  let ok=0;
  st.items.forEach((item,i)=>{
    const el=document.getElementById("seqi-"+sid+"-"+key+"-"+i);
    const numEl=document.getElementById("seqn-"+sid+"-"+key+"-"+i);
    const correct=st.correct.findIndex(c=>c.id===item.id)===i;
    el.classList.remove("seq-correct","seq-wrong");
    el.classList.add(correct?"seq-correct":"seq-wrong");
    numEl.classList.remove("correct","wrong");
    numEl.classList.add(correct?"correct":"wrong");
    if(correct)ok++;
  });
  const msg=ok===st.items.length?"SEQUÊNCIA PERFEITA! 🎉":`VOCÊ ACERTOU ${ok} DE ${st.items.length} POSIÇÕES!`;
  document.getElementById("seqres-"+sid+"-"+key).innerHTML=`<div class="${ok===st.items.length?'success-msg':'hint-box'}" style="margin-bottom:1rem;">${msg}</div>`;
  const res=st.items.map((item,i)=>`${i+1}. ${item.text} — ${st.correct.findIndex(c=>c.id===item.id)===i?"CORRETO":"ERRADO"}`).join("\n");
  onSent(sid,st.wid,"sequence","ORDENA A SEQUÊNCIA",`ACERTOS: ${ok}/${st.items.length}\n\n${res}`,`${ok}/${st.items.length}`);
};

    );

    return`<div class="debug-item" id="dbgi-${sid}-${key}-${i}">

      </div>
      <div class="debug-feedback" id="dbfb-${sid}-${key}-${i}" style="display:none;"></div>

};
window.answerDebug=function(sid,key,idx,chosen,correct,btn){
  const st=window["dbg_"+sid+"_"+key];if(st.answers[idx]!==undefined)return;
  const ok=chosen===correct;st.answers[idx]={chosen,correct,ok};
  const opts=document.querySelectorAll(`#dbopts-${sid}-${key}-${idx} .debug-opt`);
  opts.forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add("selected-ok");else if(b===btn)b.classList.add("selected-err");});
  const fb=document.getElementById("dbfb-"+sid+"-"+key+"-"+idx);
  const cfg=ALL_DATA[st.wid]?.[sid]?.debug;
  fb.style.display="block";fb.className="debug-feedback "+(ok?"ok":"err");
  fb.textContent=ok?`✓ CORRETO! A PALAVRA CERTA É: ${correct}`:(cfg?.items[idx]?.feedback||`✗ ERRADO. A PALAVRA CERTA ERA: ${correct}`);
  if(ok) document.getElementById("derr-"+sid+"-"+key+"-"+idx)?.classList.add("fixed");
  const done=Object.keys(st.answers).length;
  document.getElementById("dbgscore-"+sid+"-"+key).textContent=`CORRIGIDOS: ${done}/${st.total}`;
  if(done===st.total){
    const okCount=Object.values(st.answers).filter(a=>a.ok).length;
    document.getElementById("dbgmsg-"+sid+"-"+key).textContent=`VOCÊ CORRIGIU ${okCount} DE ${st.total} ERROS!`;
    document.getElementById("dbgsub-"+sid+"-"+key).style.display="block";

window.submitDebug=function(sid,key){

};

window.submitMapGame=function(sid,key){
  const st=window["map_"+sid+"_"+key];
  const cfg=ALL_DATA[st.wid]?.[sid]?.mapgame;
  const res=cfg.polis.map(p=>{const a=st.answered[p.id]||{};return`${p.name}: ${a.chosen||"—"} — ${a.ok?"CORRETO":"ERRADO (CORRETO: "+p.correct+")"}`}).join("\n");
  onSent(sid,st.wid,"mapgame","MAPA INTERATIVO",`ACERTOS: ${st.score}/${st.total}\n\n${res}`,`${st.score}/${st.total}`);
};

/* ════════════════════════════════════════════════════════
   🖱️ ARRASTAR E SOLTAR (Andressa)
════════════════════════════════════════════════════════ */
function buildDragDrop(sid,cfg,key){
  const wid=key.replace(/_dragdrop$/,'');
  window["dd_"+sid+"_"+key]={filled:{},total:cfg.sentences.length,wid};
  // banco de palavras embaralhado
  const allOpts=shuffle([...new Set(cfg.sentences.flatMap(s=>s.options))]);
  const bank=allOpts.map(o=>`<div class="drag-chip" id="ddc-${sid}-${key}-${o.replace(/\s/g,'_')}" draggable="true"
    ondragstart="ddDragStart(event,'${sid}','${key}','${o.replace(/'/g,"\\'")}')">  ${o}</div>`).join('');
  const sentences=cfg.sentences.map((s,i)=>{
    const parts=s.text.split("___");
    return`<div class="drag-sentence">${parts[0]}<div class="drag-drop" id="ddslot-${sid}-${key}-${i}"
      ondragover="ddDragOver(event,'${sid}','${key}',${i})"
      ondragleave="ddDragLeave(event,'${sid}','${key}',${i})"
      ondrop="ddDrop(event,'${sid}','${key}',${i},'${s.blank.replace(/'/g,"\\'")}')">
    </div>${parts[1]||''}</div>`;
  }).join('');
  return`<p style="font-size:14px;font-weight:700;color:#534AB7;margin-bottom:.75rem;text-transform:uppercase;">📦 BANCO DE PALAVRAS — ARRASTE PARA O ESPAÇO CORRETO:</p>
  <div class="drag-bank" id="ddbank-${sid}-${key}">${bank}</div>
  <div>${sentences}</div>
  <div id="ddres-${sid}-${key}"></div>
  <div class="submit-area">
    <button class="submit-btn" onclick="checkDragDrop('${sid}','${key}')">VERIFICAR E ENVIAR</button>
    <button class="retry-btn" onclick="openAct('${sid}','dragdrop','${wid}')">RECOMEÇAR</button>
  </div>`;
}
window._ddDrag={};
window.ddDragStart=function(e,sid,key,word){window._ddDrag={sid,key,word};};
window.ddDragOver=function(e,sid,key,idx){e.preventDefault();document.getElementById("ddslot-"+sid+"-"+key+"-"+idx).classList.add("drag-over-slot");};
window.ddDragLeave=function(e,sid,key,idx){document.getElementById("ddslot-"+sid+"-"+key+"-"+idx).classList.remove("drag-over-slot");};
window.ddDrop=function(e,sid,key,idx,blank){
  e.preventDefault();
  const{word}=window._ddDrag;
  const slot=document.getElementById("ddslot-"+sid+"-"+key+"-"+idx);
  slot.classList.remove("drag-over-slot");
  // devolve palavra anterior ao banco se havia
  const st=window["dd_"+sid+"_"+key];
  if(st.filled[idx]){
    const prev=st.filled[idx];
    const prevChip=document.getElementById("ddc-"+sid+"-"+key+"-"+prev.replace(/\s/g,'_'));
    if(prevChip)prevChip.classList.remove("used");
  }
  st.filled[idx]={word,blank};
  slot.textContent=word;slot.classList.add("filled");slot.classList.remove("wrong-fill");
  const chip=document.getElementById("ddc-"+sid+"-"+key+"-"+word.replace(/\s/g,'_'));
  if(chip)chip.classList.add("used");
};
window.checkDragDrop=function(sid,key){
  const st=window["dd_"+sid+"_"+key];
  const cfg=ALL_DATA[st.wid]?.[sid]?.dragdrop||ALL_DATA[st.wid]?.[sid]?.truefalse;
  const ddcfg=ALL_DATA[st.wid]?.[sid]?.dragdrop;if(!ddcfg)return;
  let ok=0;
  ddcfg.sentences.forEach((s,i)=>{
    const slot=document.getElementById("ddslot-"+sid+"-"+key+"-"+i);
    const filled=st.filled[i];
    const correct=filled?.word?.trim().toUpperCase()===s.blank.toUpperCase();
    slot.classList.remove("filled","wrong-fill");
    slot.classList.add(correct?"filled":"wrong-fill");
    if(correct)ok++;
  });
  const res=ddcfg.sentences.map((s,i)=>`"${s.text.replace("___","["+( st.filled[i]?.word||"—")+"]")}" — ${(st.filled[i]?.word||"").trim().toUpperCase()===s.blank.toUpperCase()?"CORRETO":"ERRADO (CORRETO: "+s.blank+")"}`).join("\n");
  onSent(sid,st.wid,"dragdrop","ARRASTA E SOLTA",`ACERTOS: ${ok}/${ddcfg.sentences.length}\n\n${res}`,`${ok}/${ddcfg.sentences.length}`);
};

window.openAct=openAct;window.switchTab=switchTab;
buildTabs();
